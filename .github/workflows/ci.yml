name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      # MacB uses APIs that only exist in the macOS 26 SDK — Liquid Glass
      # among them — so the build needs the Xcode that ships it. The
      # runner has several installed and defaults to an older one.
      - name: Use the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          swift --version
      - name: Build
        run: swift build
      - name: Core scenarios
        run: ./scripts/test.sh
      - name: XCTest
        run: swift test
      - name: Package smoke test
        run: |
          MACB_APP_DIR="$RUNNER_TEMP/MacB.app" ./scripts/build.sh release
          "$RUNNER_TEMP/MacB.app/Contents/MacOS/MacB" --smoke-test
